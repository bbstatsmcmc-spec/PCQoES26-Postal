<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Postal Quality of Experience Survey 2026</title>
<style>
:root{--ink:#14232e;--muted:#55677a;--line:#d5dde5;--paper:#fff;--bg:#eef2f5;--brand:#1b4965;--soft:#e3edf4;--ok:#1d7a46;--bad:#b3261e;--badsoft:#fdecea}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:0 16px 64px}
header.top{background:#fff;border-bottom:4px solid var(--brand)}
header.top .wrap{padding-top:24px;padding-bottom:24px}
.head{display:flex;align-items:center;gap:18px}
.logo{height:84px;width:auto;flex:none;margin-left:-28px}
header.top h1{color:var(--brand);margin:0 0 4px;font-size:1.25rem;font-weight:650;letter-spacing:-.01em}
header.top p{margin:0;color:var(--muted)}
.badge{display:inline-block;margin-top:10px;padding:3px 10px;border:1px solid #9fb0bf;color:var(--muted);border-radius:4px;font-size:.85rem}
.lang{margin-left:auto;display:flex;flex:none}
.lang button{border:1px solid var(--brand);background:#fff;color:var(--brand);padding:6px 14px;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer}
.lang button:first-child{border-radius:6px 0 0 6px}.lang button:last-child{border-radius:0 6px 6px 0;border-left:0}.lang .on{background:var(--brand);color:#fff}
.bar{position:sticky;top:0;height:5px;background:#e3e9ee;z-index:5}.bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .15s}
.card,.q{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:20px 24px;margin-top:16px}
.q.err{border-color:var(--bad);background:var(--badsoft)}
h2{margin:28px 0 0;font-size:1.15rem;color:var(--brand)}.card h2{margin:0 0 6px}
.qh b{color:var(--brand);margin-right:8px}.qh{font-weight:600}
.n{color:var(--muted);font-size:.9rem;margin:4px 0 8px}
.statement{background:var(--soft);font-size:.93rem}
label.o{display:flex;gap:10px;align-items:flex-start;padding:6px 2px;cursor:pointer}
label.o input{width:18px;height:18px;margin-top:3px;flex:none;accent-color:var(--brand)}
label.f{display:block;font-weight:600;font-size:.93rem;margin:8px 0 4px}.req{color:var(--bad)}
input[type=text],input[type=email]{width:100%;padding:9px 10px;font:inherit;color:var(--ink);border:1px solid #9fb0bf;border-radius:5px;background:#fff;margin:2px 0}
input:focus,button:focus-visible{outline:3px solid #7fb3d5;outline-offset:1px;border-color:var(--brand)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row{border-top:1px solid #edf1f4;padding:10px 0}.row>span{display:block;font-size:.95rem;font-weight:600;margin-bottom:4px}
.pl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:3px 0}.pl em{font-style:normal;font-size:.8rem;color:var(--muted);min-width:90px}
.pl button{min-width:40px;padding:6px 10px;border:1px solid #9fb0bf;background:#fff;color:var(--ink);border-radius:5px;font:inherit;font-size:.9rem;cursor:pointer}
.pl button:hover{background:var(--soft)}.pl button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.lg{font-size:.82rem;color:var(--muted);background:var(--soft);padding:8px 10px;border-radius:6px;margin:6px 0}
.btn{background:var(--brand);color:#fff;border:0;border-radius:6px;padding:12px 26px;font:inherit;font-weight:600;cursor:pointer;margin-top:20px}.btn:hover{background:#143a52}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand);margin-top:6px}
.er{border:1px solid var(--bad);background:var(--badsoft);color:var(--ink)}.er b{color:var(--bad)}.er ul{margin:6px 0 0;padding-left:1.2rem}.hid{display:none}
.ref{font-size:1.4rem;font-weight:700;letter-spacing:.02em;color:var(--ok)}
.help{font-size:.9rem;color:var(--muted);margin-top:28px}
@media(max-width:640px){.logo{height:60px;margin-left:-8px}.head{gap:10px;flex-wrap:wrap}header.top h1{font-size:1.2rem}.grid2{grid-template-columns:1fr}.card,.q{padding:16px 14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
details.sec{background:#fff;border:1px solid var(--line);border-radius:8px;margin-top:16px}
details.sec>summary{display:flex;align-items:center;gap:10px;padding:14px 20px;font-size:1.1rem;font-weight:650;color:var(--brand);cursor:pointer;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}details.sec>summary::before{content:"▸";font-size:.9rem}details.sec[open]>summary::before{content:"▾"}
details.sec[open]>summary{border-bottom:1px solid var(--line)}.cnt{margin-left:auto;font-size:.8rem;font-weight:600;color:var(--muted);background:var(--soft);padding:2px 10px;border-radius:10px}
.bd{padding:2px 16px 16px}.bd .q{margin-top:12px}
</style></head><body>

const U={ti:["Postal Quality of Experience Survey 2026","Kajian Kualiti Pengalaman Postal 2026"],ag:["Malaysian Communications and Multimedia Commission (MCMC)","Suruhanjaya Komunikasi dan Multimedia Malaysia (MCMC)"],cf:["Confidential","Sulit"],
intro:["MCMC is conducting a survey on the quality of experience of postal services (Pos Malaysia) in Malaysia. Participation is voluntary and takes about 15 minutes. Your personal information is kept confidential and used for this survey only. Express courier and commercial courier services are not covered.","MCMC menjalankan survei kualiti pengalaman perkhidmatan pos (Pos Malaysia) di Malaysia. Penyertaan adalah sukarela dan mengambil masa kira-kira 15 minit. Maklumat peribadi anda DIRAHSIAKAN dan hanya digunakan untuk survei ini. Kurier ekspres dan komersial tidak termasuk."],
sub:["Submit","Hantar"],fix:["Please answer the following before submitting:","Sila jawab soalan berikut sebelum menghantar:"],
ok:["Submission received","Penghantaran diterima"],th:["Thank you. Your response has been recorded.","Terima kasih. Jawapan anda telah direkodkan."],
rf:["Reference","Rujukan"],ed:["Edit and resubmit","Edit dan hantar semula"],kp:["Keep this reference. If you correct and resubmit, the latest submission is used.","Simpan rujukan ini. Jika anda membetulkan dan menghantar semula, penghantaran terkini akan digunakan."],
ct:["For assistance: MCMC 1-800-188-030","Untuk bantuan: MCMC 1-800-188-030"],sp:["Please specify","Sila nyatakan"],
im:["Importance","Kepentingan"],sa:["Satisfaction","Kepuasan"],lo:["1 = Extremely not","1 = Sangat tidak"],hi:["5 = Extremely","5 = Sangat"],
lgi:["IMPORTANCE: 1 Extremely not important · 3 Neutral · 5 Extremely important<br>SATISFACTION: 1 Extremely not satisfied · 3 Neutral · 5 Extremely satisfied","KEPENTINGAN: 1 Sangat tidak penting · 3 Neutral · 5 Sangat penting<br>KEPUASAN: 1 Sangat tidak berpuas hati · 3 Neutral · 5 Sangat berpuas hati"],
nm:["Name","Nama"],em:["Email (optional)","Emel (pilihan)"],qn:["Queue number","Nombor giliran"],end:["Thank you for your participation. This survey is not applicable to you. Queries: MCMC 1-800-188-030.","Terima kasih atas penyertaan anda. Survei ini tidak berkaitan dengan anda. Pertanyaan: MCMC 1-800-188-030."]};
const IMP="Extremely not important|Sangat tidak penting;Not important|Tidak penting;Neutral|Neutral;Important|Penting;Extremely important|Sangat penting";
const SAT="Extremely dissatisfied|Sangat tidak berpuas hati;Dissatisfied|Tidak berpuas hati;Neutral|Neutral;Satisfied|Berpuas hati;Extremely satisfied|Sangat berpuas hati";

const Q=[
{h:"Verification|Pengesahan"},
{id:"Q1",ty:"s",t:"Do you or any of your immediate family work for any of the following organisations or industries?|Adakah anda atau ahli keluarga terdekat anda bekerja untuk mana-mana syarikat berikut?",o:"Malaysian Communications and Multimedia Commission (MCMC)|Suruhanjaya Komunikasi dan Multimedia Malaysia (MCMC);Consumer Forum Malaysia (CFM)|Forum Pengguna Malaysia (CFM);Postal Forum Malaysia (PFM)|Forum Pos Malaysia (PFM);Market research company|Syarikat penyelidikan pasaran;Marketing / Advertising / Public Relations company|Pemasaran, pengiklanan atau syarikat perhubungan awam;Pos Malaysia Berhad|Pos Malaysia Berhad;None of the above|Tiada seperti di atas",end:v=>v<7},
{id:"Q2",ty:"s",t:"Which age group do you belong to?|Sila pilih lingkungan kumpulan umur anda",o:"Below 15|Bawah 15;15 – 19;20 – 24;25 – 29;30 – 34;35 – 39;40 – 44;45 – 49;50 – 54;55 – 59;60 – 64;65 and above|65 dan ke atas",end:v=>v==1},
{id:"Q2.1",ty:"s",sh:()=>A.Q2==2,t:"Before I proceed, may I seek your parent or guardian’s consent? (Personal Data Protection Act 2010: parental consent is required for respondents below 18.)|Sebelum saya meneruskan, bolehkah saya mendapatkan kebenaran daripada ibu bapa atau penjaga anda? (Akta Perlindungan Data Peribadi 2010: kebenaran ibu bapa diperlukan bagi responden bawah 18 tahun.)",o:YN,end:v=>v==2},
{h:"Introduction|Pengenalan"},
{id:"Q3",ty:"m",x:7,t:"During the past 6 months, which of the following Pos Malaysia postal services have you personally used?|Dalam tempoh 6 bulan yang lalu, yang manakah antara perkhidmatan pos Pos Malaysia berikut pernah anda gunakan secara peribadi?",o:"Ordinary mail services|Perkhidmatan surat;Ordinary parcel services|Perkhidmatan bungkusan;Insured parcel services|Perkhidmatan bungkusan berinsuran;Registered item services|Perkhidmatan item berdaftar;Advertising item services|Perkhidmatan item pengiklanan;Post free item service|Perkhidmatan item pos percuma;None of above|Tiada yang diatas",end:v=>v.includes(7)},
{id:"Q4",ty:"s",t:"During the past 6 months, how frequently do you use Pos Malaysia service?|Dalam tempoh 6 bulan yang lalu, berapa kerap anda menggunakan perkhidmatan Pos Malaysia?",o:"Daily|Setiap hari;At least once a week|Secara mingguan;At least once a month|Secara bulanan;A few times within this period|Beberapa kali dalam tempoh ini;Once a year|Setahun sekali;First time within this period|Kali pertama dalam tempoh ini;Do not know / Cannot remember|Tidak tahu / Tidak ingat"},
{h:"Criteria 1: Relevance and importance|Kriteria 1: Kerelevanan dan kepentingan"},
{id:"Q5",ty:"v",l:"im",sh:()=>sv().length>0,o:IMP,t:"How important is the following postal service to you?|Bagi anda, berapa pentingkah perkhidmatan pos berikut kepada anda?"},
{id:"Q6",ty:"v",l:"sa",sh:()=>sv().length>0,o:SAT,t:"What is your level of satisfaction with the following postal service?|Apakah tahap kepuasan anda dengan perkhidmatan pos berikut?"},
{id:"Q7",ty:"v",l:"im",sh:()=>sv().length>0,o:IMP,t:"How important is it that the following postal service continues to be available in Malaysia?|Sejauh manakah penting supaya perkhidmatan pos berikut terus tersedia di Malaysia?"},
{id:"Q8",ty:"v",sh:()=>sv().length>0,o:"Very easy|Sangat mudah;Fairly easy|Agak mudah;Neither easy nor difficult|Tidak mudah dan tidak sukar;Fairly difficult|Agak sukar;Very difficult|Sangat sukar;Do not know|Tidak tahu",t:"If the following postal service were no longer available, how easy or difficult would it be to find an alternative?|Sekiranya perkhidmatan pos berikut tidak lagi tersedia, sejauh manakah mudah atau sukarnya mencari alternatif?"},
{h:"Criteria 2: Accessibility|Kriteria 2: Kebolehcapaian"},
{id:"Q9",ty:"s",t:"Approximately how far is your residence from the nearest postal service point (Post Office, Mini Post Office, Mobile Post Office)?|Berapa jarak antara kediaman anda dengan pusat perkhidmatan pos terdekat?",n:"Mini Post Office: run by a third party/business (e.g. sundry shop), no ASNB/JPJ services. Mobile Post Office: operates from a train, vehicle or boat.|Pejabat Pos Mini: dikendalikan pihak ketiga/perniagaan (cth kedai runcit), tiada ASNB/JPJ. Pejabat Pos Bergerak: beroperasi dari kereta api, kenderaan atau bot.",o:"Less than 1km|Kurang daripada 1km;1km to 3km|1km – 3km;3km – 5km;5km – 10km;More than 10km|Lebih dari 10km;Do not know|Tidak tahu"},
{id:"Q10",ty:"s",t:"How long does it usually take you to travel from your residence to the nearest postal service point?|Berapa lamakah masa perjalanan dari kediaman anda ke pusat perkhidmatan pos terdekat?",o:"Less than 10 minutes|Kurang daripada 10 minit;10 – 19 minutes|10 – 19 minit;20 – 29 minutes|20 – 29 minit;30 – 59 minutes|30 – 59 minit;60 minutes or more|60 minit atau lebih;Don’t know|Tidak tahu"},
{id:"Q11",ty:"g",r:"Distance to nearest postal service point|Jarak ke pusat perkhidmatan pos terdekat;Cost of travelling to the postal service point|Kos perjalanan ke pusat perkhidmatan pos;Operating days|Hari operasi;Operating hours|Waktu operasi;Availability of postal service facilities|Ketersediaan fasiliti perkhidmatan pos"},

const Q3O=Q.find(q=>q.id=="Q3").o.split(";").map(s=>s.split("|"));
let A={},X={},lang="en",ref=null,fin=0,err=[];
const L=()=>lang=="ms"?1:0,T=s=>{let p=s.split("|");return p[L()]||p[0]},u=k=>U[k][L()];
const sv=()=>(A.Q3||[]).filter(i=>i<7).sort((a,b)=>a-b);
const svn=i=>Q3O[i-1][L()]||Q3O[i-1][0];
const low=id=>Object.values(A[id]||{}).some(r=>r.s<=2);
const lowSv=id=>Object.entries(A[id]||{}).filter(([k,r])=>r.s<=2).map(([k])=>+k);
const contacted=()=>(A.Q17||[]).length>0&&!A.Q17.includes(8);
const pipe=s=>s.replace("[SVC]",sv().map(svn).join(", ")).replace("[LOW]",lowSv("Q20").map(svn).join(", "));
const setL=l=>{lang=l;R()};
function rows(q){if(q.sv||q.ty=="v")return sv().map(i=>[i,svn(i)]);let r=q.r.split(";").map((s,i)=>[i+1,T(s.replace(/#$/,"")),s.endsWith("#")]);return r.filter(x=>!x[2]||(A.Q3||[]).includes(4))}
function vis(q){return !q.sh||q.sh()}
function pick(id,v,m,x){let a=A[id];if(m){a=a||[];let xs=[].concat(x||[]);if(a.includes(v))a=a.filter(y=>y!=v);else{a=xs.includes(v)?[v]:a.filter(y=>!xs.includes(y)).concat(v)}A[id]=a}else A[id]=v;R()}
function gs(id,r,k,v){A[id]=A[id]||{};A[id][r]=A[id][r]||{};A[id][r][k]=v;R()}
function ps(id,r,v){A[id]=A[id]||{};A[id][r]=v;R()}
function oth(id,v){X[id]=v}
const btn=(on,fn,t)=>`<button type=button class="${on?"on":""}" onclick="${fn}">${t}</button>`;
function rq(q){let h=`<div class="q${err.includes(q.id)?" err":""}"><div class=qh><b>${q.id.replace("Q","")}</b>`,id=q.id;
if(q.sv)h+=`${T("The affordability and value for money of prescribed postal service, for each service you used.|Kemampuan milik dan nilai untuk wang bagi perkhidmatan pos yang ditetapkan, bagi setiap perkhidmatan yang anda gunakan.")}`;else h+=pipe(T(q.t||"Rate each aspect of Pos Malaysia’s service.|Nilai setiap aspek perkhidmatan Pos Malaysia."));
h+="</div>";if(q.n)h+=`<p class=n>${T(q.n)}</p>`;
if(q.ty=="s"||q.ty=="m"){let m=q.ty=="m";q.o.split(";").forEach((s,i)=>{let o=s.endsWith("*"),v=i+1,c=m?(A[id]||[]).includes(v):A[id]==v;h+=`<label class=o><input type=${m?"checkbox":"radio"} ${c?"checked":""} onchange='pick("${id}",${v},${m},${JSON.stringify(q.x||0)})'>${T(o?s.slice(0,-1):s)}</label>`;if(o&&c)h+=`<input type=text placeholder="${u("sp")}" value="${(X[id]||"").replace(/"/g,"&quot;")}" onchange='oth("${id}",this.value)'>`})}
if(q.ty=="n"){h+=`<div class=pl>`+[...Array(11).keys()].map(i=>btn(A[id]===i,`pick('${id}',${i})`,i)).join("")+`</div>`}
if(q.ty=="v"){let os=q.o.split(";");h+=`<div class=lg>${os.map((x,i)=>(i+1)+" = "+T(x)).join(" · ")}</div>`;rows(q).forEach(([k,n])=>{h+=`<div class=row><span>${n}</span><div class=pl>${q.l?`<em>${u(q.l)}</em>`:""}`+os.map((x,i)=>btn((A[id]||{})[k]==i+1,`ps('${id}',${k},${i+1})`,i+1)).join("")+`</div></div>`})}
if(q.ty=="p"){let os=q.o.split(";");q.r.split(";").forEach((x,i)=>{let k=i+1;h+=`<div class=row><span>${T(x)}</span><div class=pl>`+os.map((y,j)=>btn((A[id]||{})[k]==j+1,`ps('${id}',${k},${j+1})`,T(y))).join("")+`</div></div>`})}
if(q.ty=="g"){h+=`<div class=lg>${u("lgi")}</div>`;rows(q).forEach(([k,n])=>{let r=(A[id]||{})[k]||{};h+=`<div class=row><span>${n}</span>`+[["i","im"],["s","sa"]].map(([f,l])=>`<div class=pl><em>${u(l)}</em>`+[1,2,3,4,5].map(v=>btn(r[f]==v,`gs('${id}',${k},'${f}',${v})`,v)).join("")+`</div>`).join("")+`</div>`})}
return h+"</div>"}
const SO={0:1};
function run(){let secs=[],cur,stop=0,ms=missing();for(const q of Q){if(q.h){cur={h:T(q.h),qs:[],n:0,d:0};secs.push(cur);continue}if(!vis(q))continue;cur.qs.push(rq(q));cur.n++;if(!ms.includes(q.id))cur.d++;if(q.end&&A[q.id]!=null&&q.end(A[q.id])){stop=q.id;SO[secs.length-1]=1;break}}
return[secs.map((x,i)=>`<details class=sec ${SO[i]?"open":""} ontoggle="SO[${i}]=this.open"><summary>${x.h}<span class=cnt>${x.d}/${x.n}</span></summary><div class=bd>${x.qs.join("")}</div></details>`),stop]}
function missing(){let m=[];for(const q of Q){if(q.h||!vis(q))continue;let a=A[q.id],ok;if(q.ty=="m")ok=a&&a.length;else if(q.ty=="g"||q.ty=="v"||q.ty=="p"){let rs=q.ty=="p"?q.r.split(";").map((s,i)=>[i+1]):rows(q);ok=rs.every(([k])=>a&&a[k]!=null&&(q.ty!="g"||(a[k].i&&a[k].s)))}else ok=a!=null;
if(ok&&q.o&&(q.ty=="m"||q.ty=="s")){let os=q.o.split(";"),sel=[].concat(a);sel.forEach(v=>{if(os[v-1].endsWith("*")&&!(X[q.id]||"").trim())ok=0})}
if(!ok)m.push(q.id);if(q.end&&a!=null&&q.end(a))break}return m}
function R(){document.documentElement.lang=lang;$("ti").textContent=u("ag");$("cf").textContent=u("cf");$("sub").textContent=u("ti");$("b0").className=lang=="en"?"on":"";$("b1").className=lang=="ms"?"on":"";document.title=u("ti");
if(fin){$("app").innerHTML=`<div class=card><h2>${u("ok")}</h2><p>${u("th")}</p><p>${u("rf")}: <span class=ref>${ref}</span></p><p class=n>${u("kp")}</p><button class="btn ghost" onclick="fin=0;R()">${u("ed")}</button></div><div class=help>${u("ct")}</div>`;return}
let y=window.scrollY,[o,stop]=run();let tot=Q.filter(q=>!q.h&&vis(q)).length,dn=tot-missing().length;
let h=`<div class="card statement">${u("intro")}</div><div class=card><label class=f>${u("nm")}</label><input type=text id=rn value="${(X.rn||"").replace(/"/g,"&quot;")}" onchange="X.rn=this.value"><label class=f>${u("em")}</label><input type=email value="${X.re||""}" onchange="X.re=this.value"><label class=f>${u("qn")}</label><input type=text value="${(X.rq||"").replace(/"/g,"&quot;")}" onchange="X.rq=this.value"></div>`+o.join("");
if(stop){h+=`<div class=card><p>${u("end")}</p><button class=btn onclick="send('terminated')">${u("sub")}</button></div>`}
else{h+=`<div class="card er ${err.length?"":"hid"}" id=es><b>${u("fix")}</b><ul>${err.map(e=>`<li>${e.replace("Q","")}</li>`).join("")}</ul></div><button class=btn onclick="send('complete')">${u("sub")}</button>`}h+=`<div class=help>${u("ct")}</div>`;
$("app").innerHTML=h;$("pg").style.width=Math.round(dn/tot*100)+"%";window.scrollTo(0,y)}
const $=i=>document.getElementById(i);
function flat(st){let d={};for(const q of Q){if(q.h||!vis(q)||A[q.id]==null)continue;let a=A[q.id],id=q.id;
if(q.ty=="g")Object.entries(a).forEach(([k,r])=>{d[`${id}_${k}_imp`]=r.i;d[`${id}_${k}_sat`]=r.s});
else if(q.ty=="v"||q.ty=="p")Object.entries(a).forEach(([k,v])=>d[`${id}_${k}`]=v);
else d[id]=Array.isArray(a)?a.sort((x,y)=>x-y).join(";"):a;
if(X[id])d[id+"_other"]=X[id];if(q.end&&q.end(a))break}return d}
async function send(st){if(st=="complete"){err=missing();let si=-1;for(const q of Q){if(q.h){si++;continue}if(err.includes(q.id))SO[si]=1}if(err.length){R();$("es")&&$("es").scrollIntoView();return}}
ref=ref||"PCQ-"+new Date().toISOString().slice(2,10).replace(/-/g,"")+"-"+Math.random().toString(36).slice(2,7).toUpperCase();
let b={ref,ts:new Date().toISOString(),lang,status:st,name:X.rn||"",email:X.re||"",queue:X.rq||"",data:flat()};
try{if(ENDPOINT)await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(b)});else console.log("ENDPOINT not set",b)}catch(e){console.error(e)}
fin=1;err=[];R();window.scrollTo(0,0)}
R();
